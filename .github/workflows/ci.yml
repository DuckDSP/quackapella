name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: fmt, clippy, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Toolchain and components come from rust-toolchain.toml.
      - run: rustup show
      - timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends pkg-config libx11-dev libxcb1-dev libxkbcommon-dev libwayland-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # rt-paranoid: fails if process() allocates.
      - run: cargo test --workspace --features quack-plugin/rt-paranoid,quack-link-plugin/rt-paranoid

  macos:
    name: macOS bundles (AU v2, VST3, CLAP) + auval
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-truce --version =6.3.0 --locked
      - run: cargo test --workspace --features quack-plugin/rt-paranoid,quack-link-plugin/rt-paranoid
      - name: Build and pack bundles
        run: scripts/bundle.sh
      - name: auval (AU v2)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R target/bundles/Quackapella.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar >/dev/null 2>&1 || true
          auval -strict -v aumf Qkpl DKDS
      - name: pluginval (VST3)
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pluginval.zip
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 \
            --skip-gui-tests --validate-in-process \
            --validate target/bundles/Quackapella.vst3
      - uses: actions/upload-artifact@v4
        with:
          name: quackapella-macos
          path: dist/*.zip
          if-no-files-found: error
